server:
  port: 8091

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: postgres
    password: postgres
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest

outbox:
  relay:
    enabled: true

saga:
  step-timeout-seconds: 30
  max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: order-service

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
