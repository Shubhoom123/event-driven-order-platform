server:
  port: 8093

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: postgres
    password: postgres
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest

outbox:
  relay:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: payment-service

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
